name: reminders
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --prefix jobs --no-audit --no-fund
      - run: node jobs/reminders.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # GitHub pauses schedules in repos with no activity for 60 days; a tiny monthly commit keeps it alive.
      - name: keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          d=$(date -u +%Y-%m)
          if [ "$(cat .keepalive 2>/dev/null)" != "$d" ]; then
            echo "$d" > .keepalive
            git config user.name "sahibi-bot"; git config user.email "actions@users.noreply.github.com"
            git add .keepalive && git commit -m "keepalive $d" && git push || true
          fi
