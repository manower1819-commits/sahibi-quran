name: reminders
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
# one run at a time: two overlapping runs (a late scheduled run and a manual one) must not send the same notification twice
concurrency:
  group: reminders
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix jobs --no-audit --no-fund   # exactly the versions in jobs/package-lock.json
      - run: node jobs/reminders.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # GitHub pauses schedules in repos with no activity for 60 days; a tiny monthly commit keeps it alive.
      - name: keep schedule alive
        if: ${{ always() && github.event_name == 'schedule' }}   # also after a red run: the schedule must not lapse because the job failed
        run: |
          d=$(date -u +%Y-%m)
          if [ "$(cat .keepalive 2>/dev/null)" != "$d" ]; then
            echo "$d" > .keepalive
            git config user.name "sahibi-bot"; git config user.email "actions@users.noreply.github.com"
            git add .keepalive && git commit -m "keepalive $d" && git push || echo "::warning::keepalive could not be pushed; GitHub pauses the schedule after 60 days without activity"
          fi
