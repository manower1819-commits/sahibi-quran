name: test
# Runs on pull requests and on every branch except main (main is covered by deploy.yml).
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: python3 build.py
  # The Firestore security rules against the emulator (needs Java). A separate job, so a rules failure never hides the result of "test".
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund @firebase/rules-unit-testing@5.0.2
      - run: npx --yes firebase-tools@15.34.0 emulators:exec --only firestore --project demo-sahibi "node --test test-rules/rules.test.js"
